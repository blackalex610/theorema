name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      # The migration tests run against real PostgreSQL as well as SQLite:
      # the advisory lock, NOT NULL relaxation and concurrent cold starts
      # only exist there.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Vercel's Python runtime default.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Migration chain runs from empty on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          ENVIRONMENT: test
        run: python -m alembic upgrade head

  frontend:
    name: Frontend (lint, typecheck + build, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  realtime:
    name: Realtime server (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: realtime-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: realtime-server/package-lock.json
      - run: npm ci
      - run: npm test
